# Google Cloud Build configuration for Room Protocol Backend
steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/room-protocol-backend:$COMMIT_SHA', '.']
    
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/room-protocol-backend:$COMMIT_SHA']
    
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'room-protocol-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/room-protocol-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'DEBUG=false,HOST=0.0.0.0'

images:
  - 'gcr.io/$PROJECT_ID/room-protocol-backend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
